
services:
  postgres:
    image: postgis/postgis:18-3.7
    restart: unless-stopped
    shm_size: 64mb

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/18/docker

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  
  nominatim:
    image: mediagis/nominatim:5.3
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    env_file:
      - ./src/infrastructure/nominatim/.env

    shm_size: 1gb

    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

volumes:
  postgres_data:

  redis_data:

  nominatim_data: